<script>
/* ============================================================
   STATE KLIEN
   ============================================================ */
const state = {
  ws: null,
  role: null,
  roomCode: null,
  deviceId: localStorage.getItem('sb_device_id') || (() => {
    const id = 'DEV-' + Math.random().toString(36).slice(2, 8).toUpperCase();
    localStorage.setItem('sb_device_id', id);
    return id;
  })(),
  teams: [],
  devices: [],
  totalReguAktif: 2,
  buzzerArmed: false,
  activeTeam: null,
  roundNumber: 0,
  roundTimer: null,
  answerTimer: null,
  pesertaTeamId: null,
  settings: { roundDuration: 30, answerDuration: 15 },
  timerInterval: null,
  isPrimary: false,
  juriCount: 0,
  hasEverConnected: false,   // ← penting: jangan toast saat connect pertama
  connecting: false
};

/* ============================================================
   WEBSOCKET — tanpa toast "koneksi terputus" saat pertama connect
   ============================================================ */
const WS_URL = (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host;

function connectWS() {
  if (state.connecting) return Promise.reject('connecting');
  if (state.ws && state.ws.readyState === 1) return Promise.resolve();
  state.connecting = true;

  return new Promise((resolve, reject) => {
    try {
      state.ws = new WebSocket(WS_URL);
    } catch (e) {
      state.connecting = false;
      return reject(e);
    }

    const timeout = setTimeout(() => {
      if (state.ws && state.ws.readyState !== 1) {
        state.connecting = false;
        try { state.ws.close(); } catch (_) {}
        reject(new Error('timeout'));
      }
    }, 5000);

    state.ws.onopen = () => {
      clearTimeout(timeout);
      state.connecting = false;
      state.hasEverConnected = true;
      resolve();
    };

    state.ws.onerror = () => {
      clearTimeout(timeout);
      state.connecting = false;
      // Jangan tampilkan apa-apa saat pertama connect gagal — biarkan form tetap terbuka
      reject(new Error('error'));
    };

    state.ws.onclose = () => {
      state.connecting = false;
      // HANYA tampilkan toast jika sebelumnya sudah pernah connect
      if (state.hasEverConnected && state.role) {
        showToast('⚠️ Koneksi terputus. Mencoba menyambung ulang…', 'warn');
        setTimeout(() => {
          if (!state.role) return;
          connectWS().then(() => {
            if (state.role === 'juri') {
              wsSend({ type: 'JOIN_AS_JURI', roomCode: state.roomCode });
            } else if (state.role === 'peserta') {
              wsSend({ type: 'JOIN_AS_PESERTA', roomCode: state.roomCode, deviceId: state.deviceId });
            }
          }).catch(() => {});
        }, 2000);
      }
    };

    state.ws.onmessage = (ev) => {
      try { handleServerMessage(JSON.parse(ev.data)); } catch (e) { console.error(e); }
    };
  });
}

function wsSend(msg) {
  if (state.ws && state.ws.readyState === 1) {
    state.ws.send(JSON.stringify(msg));
  }
}

/* ============================================================
   HANDLE PESAN SERVER
   ============================================================ */
function handleServerMessage(msg) {
  switch (msg.type) {
    case 'HELLO':
      // diam — tidak ada toast
      break;

    case 'ROOM_CREATED':
      state.roomCode = msg.roomCode;
      state.role = 'juri';
      state.isPrimary = true;
      closeModals();
      enterApp();
      showToast('✅ Room dibuat. Kode: ' + msg.roomCode, 'ok');
      break;

    case 'JOINED_JURI':
      state.roomCode = msg.roomCode;
      state.role = 'juri';
      state.isPrimary = !!msg.isPrimary;
      closeModals();
      enterApp();
      if (state.isPrimary) {
        showToast('✅ Kamu JURI UTAMA di room ' + msg.roomCode, 'ok');
      } else {
        showToast('✅ Kamu JURI PENDUKUNG di room ' + msg.roomCode, 'ok');
      }
      break;

    case 'JURI_JOIN_ERROR':
      showToast('❌ ' + msg.message, 'error');
      SFX.fail();
      break;

    case 'JOINED_PESERTA':
      state.roomCode = msg.roomCode;
      state.role = 'peserta';
      closeModals();
      openTeamChoice();
      break;

    case 'STATE':
      applyState(msg);
      break;

    case 'JOIN_ERROR':
      showToast('❌ ' + msg.message, 'error');
      SFX.fail();
      break;

    case 'FULL':
      showToast('❌ ' + msg.message, 'error');
      SFX.fail();
      setTimeout(() => location.reload(), 2500);
      break;

    case 'CLAIM_ACCEPTED':
      state.pesertaTeamId = msg.teamId;
      closeModals();
      enterApp();
      showToast('✅ Kamu masuk sebagai ' + msg.teamName, 'ok');
      break;

    case 'CLAIM_REJECTED':
      showToast('❌ ' + msg.reason, 'error');
      SFX.fail();
      openTeamChoice();
      break;

    case 'REASSIGNED':
      state.pesertaTeamId = msg.teamId;
      showToast('🔄 Dipindah ke ' + msg.teamName, 'ok');
      break;

    case 'KICKED':
      showToast('🚫 ' + msg.reason, 'warn');
      setTimeout(() => location.reload(), 1500);
      break;

    case 'JURI_OFFLINE':
      showToast('⚠️ Juri terputus. Tunggu juri kembali.', 'warn');
      break;

    case 'BUZZ_WINNER':
      if (msg.codeChanged) {
        state.roomCode = msg.newCode;
        document.getElementById('roomCodeDisplay').textContent = msg.newCode;
        showToast('🔑 Kode room berganti: ' + msg.newCode, 'ok');
      }
      SFX.buzz(msg.teamId);
      break;

    case 'ROUND_TIMEOUT':
      showToast('⏰ Waktu ronde habis! Bel terkunci.', 'warn');
      SFX.fail();
      break;

    case 'ANSWER_TIMEOUT':
      showToast('⏰ Waktu jawab habis!', 'warn');
      SFX.wrong();
      break;

    case 'ROOM_CODE_RESET':
      state.roomCode = msg.roomCode;
      document.getElementById('roomCodeDisplay').textContent = msg.roomCode;
      showToast('🔑 Kode baru: ' + msg.roomCode, 'ok');
      break;

    case 'PROMOTED_TO_PRIMARY':
      state.isPrimary = true;
      showToast('👑 Kamu dipromosikan menjadi JURI UTAMA', 'ok');
      break;

    case 'PRIMARY_CHANGED':
      // Juri lain tahu siapa primary sekarang
      break;
  }
}

function applyState(s) {
  state.teams = s.teams;
  state.devices = s.devices;
  state.totalReguAktif = s.totalReguAktif;
  state.buzzerArmed = s.buzzerArmed;
  state.activeTeam = s.activeTeam;
  state.roundNumber = s.roundNumber;
  state.roundTimer = s.roundTimer;
  state.answerTimer = s.answerTimer;
  state.settings = s.settings;
  if (s.isPrimary !== undefined) state.isPrimary = s.isPrimary;
  if (s.juriCount !== undefined) state.juriCount = s.juriCount;

  if (s.roomCode !== state.roomCode) state.roomCode = s.roomCode;
  document.getElementById('roomCodeDisplay').textContent = state.roomCode;

  if (state.role === 'juri') renderJuriPanel();
  else if (state.role === 'peserta') renderPesertaPanel();
  renderStage();
  startTimerLoop();
}

/* ============================================================
   RENDER — STAGE
   ============================================================ */
function renderStage() {
  const chip = document.getElementById('statusChip');
  chip.className = 'chip';
  if (state.buzzerArmed) { chip.classList.add('siap'); chip.textContent = '🟢 SIAP'; }
  else if (state.activeTeam !== null) { chip.classList.add('hit'); chip.textContent = '🔴 DITEKAN'; }
  else { chip.classList.add('stby'); chip.textContent = 'STANDBY'; }

  const rc = document.getElementById('roundChip');
  if (state.roundNumber > 0) { rc.style.display = 'inline-block'; rc.textContent = 'Ronde ' + state.roundNumber; }
  else rc.style.display = 'none';

  if (state.activeTeam !== null) {
    const t = state.teams[state.activeTeam];
    document.getElementById('idleDisplay').style.display = 'none';
    const active = document.getElementById('activeDisplay');
    active.classList.add('show');
    active.style.color = t.color;
    document.getElementById('activeBadge').textContent = '🔔 BEL DITEKAN';
    document.getElementById('activeBadge').style.background = t.color;
    document.getElementById('activeName').textContent = t.name;
    document.getElementById('activeName').style.color = t.color;
  } else {
    document.getElementById('idleDisplay').style.display = 'flex';
    document.getElementById('activeDisplay').classList.remove('show');
    document.getElementById('idleText').textContent = state.buzzerArmed ? 'BEL TERBUKA!' : 'MENUNGGU JURI';
    document.getElementById('idleSub').textContent = state.buzzerArmed ? 'Tekan tombol bel secepat mungkin!' : 'Bel akan dibuka ketika juri menekan ARM';
  }

  const lb = document.getElementById('lbContent');
  lb.innerHTML = '';
  const active = state.teams.slice(0, state.totalReguAktif);
  const sorted = [...active].sort((a, b) => b.score - a.score);
  sorted.forEach((t, i) => {
    const row = document.createElement('div');
    row.className = 'lb-row';
    const medal = i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : (i + 1);
    row.innerHTML = `
      <span class="lb-rank">${medal}</span>
      <span class="lb-dot" style="background:${t.color}"></span>
      <span class="lb-name">${t.name}</span>
      <span class="lb-score">${t.score}</span>
    `;
    lb.appendChild(row);
  });
}

/* ============================================================
   RENDER — PANEL JURI
   ============================================================ */
function renderJuriPanel() {
  const jl = document.getElementById('joinedList');
  const jc = document.getElementById('joinedCount');
  jc.textContent = state.devices.filter(d => d.teamId !== null).length;
  jl.innerHTML = '';
  const joined = state.devices.filter(d => d.teamId !== null);
  if (joined.length === 0) {
    jl.innerHTML = '<div style="text-align:center; color:#999; font-size:0.72rem; padding:8px;">Belum ada peserta</div>';
  } else {
    joined.forEach(d => {
      const t = state.teams[d.teamId];
      const item = document.createElement('div');
      item.className = 'joined-item';
      item.innerHTML = `
        <span class="ji-name" style="color:${t ? t.color : '#999'}">${t ? t.name : '?'}</span>
        <span class="ji-dev">${d.deviceId}</span>
      `;
      jl.appendChild(item);
    });
  }

  document.getElementById('teamCountBadge').textContent = state.totalReguAktif;
  document.getElementById('teamCountValue').textContent = state.totalReguAktif;
  document.getElementById('btnMinus').disabled = state.totalReguAktif <= 2;
  document.getElementById('btnPlus').disabled = state.totalReguAktif >= 9;
  const qc = document.getElementById('quickCountBox');
  qc.innerHTML = '';
  for (let n = 2; n <= 9; n++) {
    const b = document.createElement('button');
    b.textContent = n;
    if (n === state.totalReguAktif) b.classList.add('active');
    b.onclick = () => wsSend({ type: 'CHANGE_TEAM_COUNT', count: n });
    qc.appendChild(b);
  }

  const tl = document.getElementById('teamsList');
  tl.innerHTML = '';
  state.teams.forEach((t, i) => {
    const active = i < state.totalReguAktif;
    const occupant = state.devices.find(d => d.teamId === i);
    const row = document.createElement('div');
    row.className = 'team-row' + (active ? '' : ' inactive');
    row.innerHTML = `
      <div class="num" style="background:${t.color}">${i + 1}</div>
      <div class="name">${t.name}${!active ? ' (nonaktif)' : ''}</div>
      <span style="font-size:0.65rem; font-weight:800; color:${occupant ? '#20bf6b' : '#999'}">${occupant ? '● ON' : '○ OFF'}</span>
      ${occupant ? `<button class="release-btn" onclick="releaseTeam(${i})">Lepas</button>` : ''}
      <div class="score">${t.score}</div>
    `;
    tl.appendChild(row);
  });

  document.getElementById('armBtn').disabled = state.buzzerArmed;
  document.getElementById('evalActions').style.display = state.activeTeam !== null ? 'grid' : 'none';
  document.getElementById('roundTimerControls').style.display = 'flex';

  // Info juri
  const info = document.getElementById('juriInfo');
  if (info) {
    info.textContent = state.isPrimary
      ? `👑 JURI UTAMA • ${state.juriCount} juri aktif`
      : `👥 JURI PENDUKUNG • ${state.juriCount} juri aktif`;
  }
}

/* ============================================================
   RENDER — PESERTA
   ============================================================ */
function renderPesertaPanel() {
  if (state.pesertaTeamId === null) return;
  const t = state.teams[state.pesertaTeamId];
  if (!t) return;

  document.getElementById('pesertaDot').style.background = t.color;
  document.getElementById('pesertaName').textContent = t.name;
  document.getElementById('pesertaName').style.color = t.color;

  const btn = document.getElementById('pesertaBuzzBtn');
  const btnText = document.getElementById('pesertaBtnText');
  const statusEl = document.getElementById('pesertaStatus');
  const myDevice = state.devices.find(d => d.deviceId === state.deviceId);
  const iAmActive = myDevice && myDevice.teamId === state.pesertaTeamId;

  btn.classList.remove('locked', 'taken', 'success');
  if (!iAmActive) {
    btn.disabled = true;
    btn.classList.add('locked');
    btnText.textContent = 'KAMU BELUM PIN';
  } else if (state.activeTeam !== null) {
    if (state.activeTeam === state.pesertaTeamId) {
      btn.disabled = true;
      btn.classList.add('success');
      btnText.textContent = 'KAMU! 🎉';
      statusEl.className = 'peserta-status chip siap';
      statusEl.textContent = '✅ KAMU YANG DULUAN!';
    } else {
      btn.disabled = true;
      btn.classList.add('taken');
      btnText.textContent = 'SUDAH';
      statusEl.className = 'peserta-status chip hit';
      statusEl.textContent = '🔔 ' + state.teams[state.activeTeam].name + ' DULUAN';
    }
  } else if (state.buzzerArmed) {
    btn.disabled = false;
    btnText.textContent = 'TEKAN!';
    statusEl.className = 'peserta-status chip siap';
    statusEl.textContent = '🔔 TEKAN SEKARANG!';
  } else {
    btn.disabled = true;
    btn.classList.add('locked');
    btnText.textContent = 'TUNGGU';
    statusEl.className = 'peserta-status chip stby';
    statusEl.textContent = '⏳ MENUNGGU JURI';
  }
}

/* ============================================================
   TIMER LOOP
   ============================================================ */
function startTimerLoop() {
  if (state.timerInterval) clearInterval(state.timerInterval);
  state.timerInterval = setInterval(tickTimers, 100);
  tickTimers();
}

function tickTimers() {
  if (state.roundTimer) {
    const remaining = Math.max(0, Math.ceil((state.roundTimer.endsAt - Date.now()) / 1000));
    const pct = Math.max(0, (state.roundTimer.endsAt - Date.now()) / (state.roundTimer.duration * 1000)) * 100;
    const disp = document.getElementById('roundTimerDisplay');
    const fill = document.getElementById('roundTimerFill');
    disp.textContent = formatTime(remaining);
    disp.classList.toggle('warning', remaining <= 10 && remaining > 5);
    disp.classList.toggle('danger', remaining <= 5);
    fill.style.width = pct + '%';
    fill.classList.toggle('warning', remaining <= 10 && remaining > 5);
    fill.classList.toggle('danger', remaining <= 5);
    if (remaining <= 10 && remaining > 0 && state._lastTick !== remaining) {
      state._lastTick = remaining;
      SFX.click();
    }
  } else {
    document.getElementById('roundTimerDisplay').textContent = '--:--';
    document.getElementById('roundTimerFill').style.width = '0%';
  }
  document.getElementById('roundTimerInfo').textContent = state.settings.roundDuration + 's';

  if (state.answerTimer) {
    document.getElementById('answerTimerBox').style.display = 'block';
    const remaining = Math.max(0, Math.ceil((state.answerTimer.endsAt - Date.now()) / 1000));
    const pct = Math.max(0, (state.answerTimer.endsAt - Date.now()) / (state.answerTimer.duration * 1000)) * 100;
    const disp = document.getElementById('answerTimerDisplay');
    const fill = document.getElementById('answerTimerFill');
    disp.textContent = formatTime(remaining);
    disp.classList.toggle('warning', remaining <= 5);
    disp.classList.toggle('danger', remaining <= 3);
    fill.style.width = pct + '%';
    fill.classList.toggle('warning', remaining <= 5);
    fill.classList.toggle('danger', remaining <= 3);
    document.getElementById('answerTimerInfo').textContent = state.settings.answerDuration + 's';
  } else {
    document.getElementById('answerTimerBox').style.display = 'none';
  }
}

function formatTime(sec) {
  if (sec < 0) sec = 0;
  const m = Math.floor(sec / 60);
  const s = sec % 60;
  return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
}

/* ============================================================
   AKSI JURI
   ============================================================ */
function armBuzzer() { wsSend({ type: 'ARM' }); }
function evaluate(correct) { wsSend({ type: 'EVALUATE', correct }); }
function changeTeamCount(delta) {
  const n = state.totalReguAktif + delta;
  if (n < 2 || n > 9) return;
  wsSend({ type: 'CHANGE_TEAM_COUNT', count: n });
}
function resetRoomCode() {
  if (confirm('Reset kode room? Semua peserta akan dikeluarkan.')) {
    wsSend({ type: 'RESET_ROOM_CODE' });
  }
}
function kickAll() {
  if (confirm('Keluarkan semua peserta?')) wsSend({ type: 'KICK_ALL' });
}
function releaseTeam(teamId) {
  if (confirm('Lepas regu ini dari perangkatnya?')) {
    wsSend({ type: 'RELEASE_TEAM', teamId });
  }
}

/* ============================================================
   AKSI PESERTA
   ============================================================ */
function buzz() {
  if (state.pesertaTeamId === null) return;
  wsSend({ type: 'BUZZ' });
  if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
}

/* ============================================================
   UI HELPERS
   ============================================================ */
function showPesertaForm() {
  closeModals();
  document.getElementById('pesertaJoinModal').classList.remove('hidden');
  setTimeout(() => document.querySelector('.code-digit').focus(), 100);
}
function showJuriForm() {
  closeModals();
  document.getElementById('juriJoinModal').classList.remove('hidden');
  setTimeout(() => document.getElementById('juriRoomCodeInput').focus(), 100);
}
function closeModals() {
  document.querySelectorAll('.modal-overlay').forEach(m => m.classList.add('hidden'));
}

function enterApp() {
  document.getElementById('landing').style.display = 'none';
  document.getElementById('app').classList.remove('hidden');
  document.getElementById('juriPanel').style.display = state.role === 'juri' ? 'flex' : 'none';
  document.getElementById('pesertaPanel').style.display = state.role === 'peserta' ? 'flex' : 'none';
  document.getElementById('roomCodeDisplay').textContent = state.roomCode;
}

/* ============================================================
   KODE INPUT OTOMATIS
   ============================================================ */
document.querySelectorAll('.code-digit').forEach(inp => {
  inp.addEventListener('input', (e) => {
    const val = e.target.value.replace(/\D/g, '');
    e.target.value = val.slice(-1);
    if (val && parseInt(e.target.dataset.idx) < 5) {
      const next = document.querySelector(`.code-digit[data-idx="${parseInt(e.target.dataset.idx)+1}"]`);
      if (next) next.focus();
    }
    if ([...document.querySelectorAll('.code-digit')].every(i => i.value)) {
      setTimeout(joinAsPeserta, 200);
    }
  });
  inp.addEventListener('keydown', (e) => {
    if (e.key === 'Backspace' && !e.target.value) {
      const prev = document.querySelector(`.code-digit[data-idx="${parseInt(e.target.dataset.idx)-1}"]`);
      if (prev) prev.focus();
    }
  });
});

async function joinAsPeserta() {
  const code = [...document.querySelectorAll('.code-digit')].map(i => i.value).join('');
  if (code.length !== 6) { showToast('⚠️ Kode harus 6 digit', 'warn'); return; }
  try {
    await connectWS();
  } catch (e) {
    showToast('❌ Tidak bisa konek ke server. Cek apakah server berjalan.', 'error');
    return;
  }
  wsSend({ type: 'JOIN_AS_PESERTA', roomCode: code, deviceId: state.deviceId });
}

async function joinAsJuri() {
  const code = document.getElementById('juriRoomCodeInput').value.trim();
  try {
    await connectWS();
  } catch (e) {
    showToast('❌ Tidak bisa konek ke server. Cek apakah server berjalan.', 'error');
    return;
  }
  if (code) {
    wsSend({ type: 'JOIN_AS_JURI', roomCode: code });
  } else {
    wsSend({ type: 'CREATE_ROOM' });
  }
}

/* ============================================================
   MODAL PILIH REGU
   ============================================================ */
function openTeamChoice() {
  const box = document.getElementById('teamChoicesBox');
  box.innerHTML = '';
  document.getElementById('teamChoiceSub').textContent =
    `Pilih regu Anda (${state.totalReguAktif} regu). Regu terpakai ditandai. Perangkat: ${state.deviceId}`;
  for (let i = 0; i < state.totalReguAktif; i++) {
    const t = state.teams[i];
    if (!t) continue;
    const occupant = state.devices.find(d => d.teamId === i);
    const isMine = occupant && occupant.deviceId === state.deviceId;
    const isTaken = occupant && occupant.deviceId !== state.deviceId;
    const btn = document.createElement('button');
    btn.className = 'team-choice ' + (isMine ? 'mine' : (isTaken ? 'terpakai' : 'kosong'));
    if (!isTaken) { btn.style.color = t.color; btn.style.borderColor = t.color; }
    if (isMine) { btn.style.background = t.color; btn.style.color = 'white'; }
    let status = '';
    if (isMine) status = '<span class="tc-status" style="background:rgba(255,255,255,0.3); color:white;">REGUMU</span>';
    else if (isTaken) status = `<span class="tc-status" style="background:rgba(107,107,107,0.2); color:#6b6b6b;">TERPAKAI</span>`;
    else status = '<span class="tc-status" style="background:rgba(38,222,129,0.2); color:#20bf6b;">KOSONG</span>';
    btn.innerHTML = `<span class="tc-num">${i+1}</span><span>${t.name}</span>${status}`;
    btn.onclick = () => {
      if (isTaken) { showToast('⚠️ Regu sudah terpakai', 'warn'); return; }
      wsSend({ type: 'CLAIM_TEAM', teamId: i });
    };
    box.appendChild(btn);
  }
  document.getElementById('teamChoiceModal').classList.remove('hidden');
}

/* ============================================================
   SFX
   ============================================================ */
const SFX = (() => {
  let ctx = null;
  function c() {
    if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
    if (ctx.state === 'suspended') ctx.resume();
    return ctx;
  }
  function beep(freq, dur, type, gainVal) {
    const ac = c();
    const o = ac.createOscillator();
    const g = ac.createGain();
    o.type = type || 'sine';
    o.frequency.value = freq;
    const t = ac.currentTime;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(gainVal || 0.4, t + 0.005);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(ac.destination);
    o.start(t); o.stop(t + dur);
  }
  return {
    click() { beep(800, 0.05, 'sine', 0.2); },
    buzz(i) {
      const b = 500 + (i || 0) * 60;
      beep(b, 0.25, 'square', 0.5);
      beep(b * 1.5, 0.3, 'square', 0.4);
      beep(b * 2, 0.35, 'sawtooth', 0.3);
    },
    fail() { beep(300, 0.15, 'sawtooth', 0.4); setTimeout(() => beep(200, 0.25, 'sawtooth', 0.4), 150); },
    correct() { [523,659,784,1047].forEach((f,i) => setTimeout(() => beep(f, 0.18, 'sine', 0.4), i*80)); },
    wrong() { beep(250, 0.2, 'sawtooth', 0.4); setTimeout(() => beep(180, 0.3, 'sawtooth', 0.4), 200); }
  };
})();

let toastTimer = null;
function showToast(msg, type) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (type ? ' ' + type : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 3000);
}

/* ============================================================

document.getElementById('pesertaBuzzBtn').addEventListener('click', buzz);

document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (state.role === 'juri') {
    if (e.key === 'a' || e.key === 'A') armBuzzer();
    if (e.key === 'r' || e.key === 'R') wsSend({ type: 'RESET_ROUND' });
    if (e.key === 'l' || e.key === 'L') wsSend({ type: 'LOCK' });
  } else if (state.role === 'peserta' && (e.key === ' ' || e.key === 'Enter')) {
    e.preventDefault();
    buzz();
  }
});

window.addEventListener('beforeunload', () => {
  if (state.ws) state.ws.close();
});
